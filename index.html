<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vale Futebol">
  <meta name="description" content="Manager mundial com clubes, seleções, ligas, copas, competições continentais e partidas 2D.">
  <title>Vale Futebol Manager — World Edition</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/app-icon-v9.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/app-icon-v9.png">
  <link rel="stylesheet" href="./css/app.css?v=11.0.0-20260804">
  <link rel="stylesheet" href="./css/world-edition.css?v=11.0.0-20260804">
  <link rel="stylesheet" href="./css/world-edition-v11.css?v=11.0.0-20260804-release">
</head>
<body>
  <noscript>
    <section class="noscript-card">
      <h1>Vale Futebol Manager</h1>
      <p>Ative o JavaScript do navegador para jogar.</p>
    </section>
  </noscript>

  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <div class="brand-mark" aria-hidden="true">V</div>
    <h1>Vale Futebol Manager</h1>
    <div class="boot-progress"><span></span></div>
    <p>Preparando a temporada…</p>
  </div>

  <div id="orientation-gate" class="orientation-gate" role="dialog" aria-modal="true" aria-labelledby="rotate-title">
    <div class="rotate-art" aria-hidden="true">
      <span class="phone-shape"></span><span class="rotate-arrow">↻</span>
    </div>
    <h2 id="rotate-title">Gire seu dispositivo</h2>
    <p>Este jogo foi desenvolvido para ser utilizado na horizontal. Gire o celular para continuar.</p>
  </div>

  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" aria-live="assertive"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app-v11.js?v=11.0.0-20260804-release"></script>
</body>
</html>
